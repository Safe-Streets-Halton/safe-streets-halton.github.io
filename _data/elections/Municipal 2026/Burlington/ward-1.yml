# Burlington Ward 1
#
# One file per page. A page has one or more races (Oakville wards have two). Each race lists its candidates.
# Candidates are shown alphabetically by name, whatever order they are listed in here.
#
# Example race with every field filled in (copy it, then delete the leading "# "):
#
# races:
#   - id: race-ward                 # Unique on the page. Used for links and "Jump to" anchors.
#     title: Ward Councillor        # Heading for the race (shown only when the page has two or more races).
#     note: Sits on Burlington City Council and Halton Regional Council.   # Short line under the heading.
#     candidates:
#       - name: Jane Example        # Required.
#         website: https://example.com    # Optional. Campaign website; omit the line if none.
#         status: on-time             # on-time | late | late-pending | no-response
#                                     #   on-time       responded by the deadline, scored
#                                     #   late          responded after the deadline, scored and posted
#                                     #   late-pending  responded after the deadline, not yet scored or posted
#                                     #   no-response   did not respond
#         received: October 2, 2026   # Date the response arrived, as text. Optional for no-response.
#         scores:                     # 0 to 4 each. Only for on-time and late. Leave the whole block out for
#                                     # no-response and late-pending, and also for an on-time or late candidate
#                                     # whose response is still being scored: the page then shows "Rating in progress"
#                                     # and their answers, and the scores appear once you add this block.
#           ambition: 3
#           money: 2                  # Where the Money Goes
#           network: 4                # A Network for Everyone
#           health: 3                 # Health and Environment
#         responses:                  # Keyed by question id from questions.yml. Use "|" for the text.
#           transport-mode: |         # A blank line starts a new paragraph.
#             First paragraph of the answer, exactly as submitted.
#
#             Second paragraph.
#         sent: October 5, 2026       # Optional, no-response only: when the survey was sent ...
#         followed_up: October 12, 2026   # ... and when we followed up. Both optional.
#         open: true                  # Optional. Show this candidate expanded when the page loads.
#
# A ward with no responses yet: leave "candidates: []" and the page says nothing has been posted.

races:
  - id: race-ward
    title: "Ward Councillor"
    note: "Burlington ward councillors sit on both Burlington City Council and Halton Regional Council."
    candidates:
      - name: "Cheryl Hurst"
        status: on-time
        received: "September 25, 2026"
        responses:
          transport-mode: |
            I currently work in a different community and am required to have a vehicle for my job a requirement, so I drive (commute).
          transit: |
            Transit needs to be reliable and accessible to people so they can get across the city and to neighbouring communities with ease and efficiency. Working with communities on each side to have seamless transfers and connections. Working with the transit staff to use data and ridership to understand routes, number of users during operating hours and fluctuations in needs (older adult, students, commuter’s), accessibility of stops and pickup/ drop off locations, and the needs of people using the transit services.
          vision-zero: |
            The Vision Zero program that was designed to set out strategies, tools, and city measures to prevent collisions resulting in death or injury can been noted in some a areas that have seen new traffic calming turning lanes/corners to manage excessive speed. There have been the start of the cycling network through the city beginning in the west end. Realizing the Integrated system timeline for 30 years, there is much that still needs to be accomplished. Action that can be more immediate to have positive impact would be to review traffic signal controls to slow traffic down or move it ore efficiently by using data to understand the traffic timing, day use, highway overflow, or even construction needs. Looking at other communities (Hamilton) that have implemented advanced pedestrian crossing before vehicle traffic flows to see how it has lowered pedestrian-vehicle incidents and giving more time to allow accessible crossing. And review of effective traffic calming measures such as road calming tools, traffic circles, reduced speeds, visual signage, roadway design, and enforcement.
          safety-investment: |
            Safety will always be a priority for any transportation spending.
          walking-cycling: |
            Comfort and accessibility are important to people walking and cycling in our community, however, so is efficiency, safety, speed and convenience. Without multi-use trails, proper lighting, reduced risk, change remains challenging. Partnerships, funding and planned budgeting for future investment toward barriers.
          bike-infrastructure: |
            I support strategy/planning that improves safety and utilizes funds responsibly for the community.
          health-environment: |
            Transportation has large impact on our health and the environment.  Using locally sourced products and services not only financially supports our community, but it lessens the environmental impact from pollution (burning fossil fuels and carbon monoxide), traffic accidents, construction and road maintenance, noise and stress on the environment.  All of these negative impacts have direct implications for individual health, including sleep quality (noise), respiratory and cardiovascular systems (pollution and sedentary lifestyles).
          land-use: |
            We have introduced new strategies and tools to work toward a shift in land-use patterns. Policy change needs to be reflective of our community and supporting the current need while planning for the future.
      - name: "Kelvin Galbraith"
        status: on-time
        received: "September 23, 2026"
        responses:
          transport-mode: |
            I use several things to get around.  I do drive a pick up truck as I tow trailers, boats and plow the snow at my business so it really is a work vehicle for me and my family.  My wife drives a Hybrid van.

            When not driving, I have campaigned my last 2 elections on roller blades and now using a basic scooter.  I am also fortunate enough to live a few blocks from the business that I own and frequently walk to work.
          transit: |
            I have been an advocate for transit since elected and supported both the free transit for seniors and students.  I would like to see transit expanded in our future to fully service our Go Stations.  We need to fill the last mile traveled with efficient transit service so that people are less reliant on their vehicles and parking is not required at our go stations.  All of our large buses should be accessible with ramps and spaces for wheelchairs.  Front racks for bicycles as well.
          vision-zero: |
            I do think Burlington has made progress towards vision zero and a great example is the off road bike lanes that were implemented on Plains Road in Aldershot and now safer bike lanes on Prospect street.  I will continue to support the completion of the main cycling spine network through our city which is the Plains road and Fairview corridor.  The next phase on Plains road starts next year running from Waterdown road to Shadeland.

            I would also like to see more overhead crosswalks throughout our city.  I think that crossing guards do not feel entirely safe and should be supported and busy crossings with overhead flashing lights.  We just had one of these implemented on King road at Cherrywood drive.
          safety-investment: |
            I would not support any further investment in road widening within our city.  This is a recipe for inviting more vehicles into our city when they should remain on the highways.  I will support new investments in cycling infrastructure and walking paths.  After visiting Calgary this summer and observing an entire network of cycling and walking paths, Burlington can do better.  We have a new walking path in Tyandaga that I supported that connects walkers from the Golf course to City View park.  These types of paths are essential for local residents to exercise and enjoy the outdoors in our city.
          walking-cycling: |
            I believe people would enjoy cycling more if they felt safe.  The off-road bike lanes are essential to this endeavour.  After visiting the Netherlands last year, I observed clearly defined lanes for cycling beside walking lanes.  They also had many parking spaces for bikes at all train stations and local businesses.  I believe we need more visible parking solutions for bikes to that usage is visible and encouraged.

            With regards to our Provincial highway crossings, I have long supported and anticipated a bridge crossing that is in our long term plans for the Brant street area.  We are investing in our east/west bike lanes but also need to consider north/south for the network to really work.  Under bridge crossings need to feel safe moving forward.
          bike-infrastructure: |
            I have answered this for the most part above but yes I fully support additional investments in our cycling infrastructure.
          health-environment: |
            I do find that people that spend too much time in travel and traffic situations are not as happy as those that do not.  A changing work environment and work from home abilities have helped people depend less on long commutes to work.  In my role of Deputy Mayor of Business, and board work with Economic Development, we aim to bring more business and jobs to our local economy so that we have more opportunities for local residents to work.  Living and working in the same community is a dream of many and should be prioritized.
          land-use: |
            I am fully supportive of building intensified communities around our train stations.  This change in land use policy for Ontario started 10 years ago but we haven’t seen the benefits yet as the building industry is currently slumping due to market conditions.  Much of the world has residents living close to train stations to avoid auto dependence.  We in North America are only recently moving in this direction and it will be welcomed.  We cannot expand our roads much further to accommodate more vehicles.  This only places stress on local streets, parking infrastructure and pollution.

            We need to stop building communities that sprawl onto green spaces and create car dependency.  Intensifying from within our cities is the path that I would support moving forward.
