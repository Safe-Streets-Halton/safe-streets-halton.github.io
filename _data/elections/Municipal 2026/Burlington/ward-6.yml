# Burlington Ward 6
#
# One file per page. A page has one or more races (Oakville wards have two). Each race lists its candidates.
# Candidates are shown alphabetically by name, whatever order they are listed in here.
#
# Example race with every field filled in (copy it, then delete the leading "# "):
#
# races:
#   - id: race-ward                 # Unique on the page. Used for links and "Jump to" anchors.
#     title: Ward Councillor        # Heading for the race (shown only when the page has two or more races).
#     note: Sits on Burlington City Council and Halton Regional Council.   # Short line under the heading.
#     candidates:
#       - name: Jane Example        # Required.
#         website: https://example.com    # Optional. Campaign website; omit the line if none.
#         status: on-time             # on-time | late | late-pending | no-response
#                                     #   on-time       responded by the deadline, scored
#                                     #   late          responded after the deadline, scored and posted
#                                     #   late-pending  responded after the deadline, not yet scored or posted
#                                     #   no-response   did not respond
#         received: October 2, 2026   # Date the response arrived, as text. Optional for no-response.
#         scores:                     # 0 to 4 each. Only for on-time and late. Leave the whole block out for
#                                     # no-response and late-pending, and also for an on-time or late candidate
#                                     # whose response is still being scored: the page then shows "Rating in progress"
#                                     # and their answers, and the scores appear once you add this block.
#           ambition: 3
#           money: 2                  # Where the Money Goes
#           network: 4                # A Network for Everyone
#           health: 3                 # Health and Environment
#         responses:                  # Keyed by question id from questions.yml. Use "|" for the text.
#           transport-mode: |         # A blank line starts a new paragraph.
#             First paragraph of the answer, exactly as submitted.
#
#             Second paragraph.
#         sent: October 5, 2026       # Optional, no-response only: when the survey was sent ...
#         followed_up: October 12, 2026   # ... and when we followed up. Both optional.
#         open: true                  # Optional. Show this candidate expanded when the page loads.
#
# A ward with no responses yet: leave "candidates: []" and the page says nothing has been posted.

races:
  - id: race-ward
    title: "Ward Councillor"
    note: "Burlington ward councillors sit on both Burlington City Council and Halton Regional Council."
    candidates:
      - name: "Bianca Bielski"
        website: "https://votebielski.ca/"
        status: on-time
        received: "October 2, 2026"
        scores:
          ambition: 3.5
          money: 2
          network: 2.5
          health: 1.5
        responses:
          transport-mode: |
            My feet and my vehicle.
          transit: |
            Transit needs to become a more reliable and convenient choice for getting around Burlington. I would focus first on frequency, reliability, and connectivity. That means expanding frequent service on the routes with the greatest demand, improving connections between Burlington neighbourhoods and our GO stations, and working with Halton Region and neighbouring municipalities to make regional travel easier.  Ultimately, I would measure success by a simple question: Can a resident get where they need to go, when they need to get there, without having to depend on a car? I want Burlington Transit to be an increasingly practical choice for seniors, students, families, workers, and people with disabilities, while making sure future investments deliver measurable value for taxpayers.
          vision-zero: |
            Burlington has made some progress through traffic-calming measures, road safety initiatives, and plans for s speed enforcement in school zones.   Once elected, I would make road safety a priority by taking some of the following actions:

            Target dangerous locations first and prioritize improvements where the evidence shows the greatest risk.

            Reduce vehicle speeds. Expand appropriate traffic-calming measures, including raised crosswalks, speed humps, curb extensions and narrower crossings.

            Make school routes safer. Work with school boards, Halton Region and Halton Regional Police Service to improve crossings, visibility, signage and enforcement around schools and community facilities.

            Protect pedestrians and cyclists. Improve sidewalks, lighting, accessible crossings and cycling infrastructure, with particular attention to seniors, children and people with disabilities.
          safety-investment: |
            I am prepared to support transportation investments that make Burlington safer for everyone. We need to maintain our roads, but we also need safer intersections, better crossings, traffic calming, accessible sidewalks, protected cycling routes and more reliable transit.
          walking-cycling: |
            If we want people to walk and cycle more, we must make it safe and convenient. I want to see connected sidewalks, protected bike lanes, safer intersections, better lighting, wayfinding and year-round maintenance. And we have to tackle our biggest barriers. The QEW, 403, 407 and rail corridors divide Burlington. I would push for safe, accessible crossings and work with the province to get them built.
          bike-infrastructure: |
            I support expanding protected cycling infrastructure where it improves safety, makes sense and is recommended by staff.
          health-environment: |
            There is also a significant health benefit to making active transportation easier. If people can safely walk or cycle to work, school, shopping or transit, we are supporting physical activity while reducing vehicle trips.  Once elected, I would support transportation investments that improve safety, mobility and environmental outcomes together.  If we make those alternatives safe, convenient and accessible, people might choose them. That is good for our health, good for Burlington and good for the environment.
          land-use: |
            Burlington’s Official Plan moves in a good direction, particularly around Major Transit Station Areas, with policies calling for compact, mixed-use, pedestrian-oriented communities and complete streets.  As I have in the past, I would support land-use policies that encourage complete, mixed-use communities, particularly around our GO stations and major transit corridors. Most importantly, I would want land-use and transportation decisions made together. Land use and transportation must be planned together and that means the right development in the right locations, tied to infrastructure and transportation capacity.
      - name: "Chris Bouchard"
        status: late
        received: "October 10, 2026"                
        scores:
          ambition: 2
          money: 1
          network: 1
          health: 1.5
        responses:
          transport-mode: |
            It really depends on what I'm doing or where I'm going. If I'm primarily traveling within the neighbourhood I tend to walk ( I live in Headon Forest and closer to the Fortinos Plaza)  so I benefit from being close enough and able bodied to walk if I need certain things from the store. I used to work for The Beer Store so I really loved the idea of being able to live and walk in the same neighbourhood as the one located in that Fortinos plaza. I lived here for 30 years so you do benefit from some tricks of the trade to get around without needing a car. Having said that If i'm leaving my neighbourhood for work or to play hockey, see friends etc. I use my car to get around. So for sure primarily my car.
          transit: |
            I've said before that the best way to ensure we all jump on public transit is to incentivize it more than personal vehicles. I'd like to see investments in safety measures so riders can rest assured they will arrive at their destination regardless if they are a single rider or someone from a more vulnerable demographic. I also want to create a timed light system to ensure a constant flow of traffic, it should also deter speeding as light systems are timed to the speed limits set, going faster results in still arriving at a redlight. But I believe improving that flow will actually make public transit more attractive to use as Burlington has so many different points of interest across the city that you want to make the idea of parking, paying money for gas, car maintenance and insurance such a burden in comparison to the reliability, convenience and safety of public transit. It would have a cascading effect of no longer requiring road expansions and the ability to allow for infrastructure investments to alternative modes of transportation
          vision-zero: |
            For vision zero commitment, I can say I'm committed to a healthy lifestyle, but after two minutes if you see me chugging a 2 litre bottle of dr. pepper, how much do you believe I'm committed to a healthy lifestyle? I want to overhaul the e-scooter program and make it classified as a motorized vehicle and treat it as such ( m class licensing and training required, insurance, enforcement etc) I'm all for this as an alternative mode of transportation. Some people cannot afford vehicles, this is a climate friendly option, allows for traffic decongestion. But thinking it belongs in bike lanes is silly. Cyclists are varying speeds with manual power. Let's not overthink it and treat it as a vehicle for roads. Right now its a question of when not if and I'm terrified nothing is being done. What happens come winter time with no snow on the ground - are those tires even winter safe. I dont want to see any deaths, This needs to be addressed yesterday.

            I was the health and safety rep during covid for a project at the Hamilton Oshawa Port Authority ( H.O.P.A) for my company. I also completed projects on behalf of Apple that adhered to AODA standards.
          safety-investment: |
            I would vote in favor of public transit measures. 2026 budget mentioned the city has 1600km of roadways, only 46 km of bike lanes. We need a proper balance here in alternative and public transit infrastructures. As councillor, i think we should all be riding the bus to get to and from downtown Burlington city hall, If were driving our cars 1- what message does that send and 2 - how would we know ways to improve it if we don't bother experiencing it. There should be a joy in taking the city bus to the city job in the city you work in.
          walking-cycling: |
            It seems like everyone needs space but also to better understand the standard operating procedures for lack of a better term. Ive heard cyclists complain that people are walking in their lanes on summer days where sidewalks are accessible. Cyclists not following traffic signs, cars not obeying the former. We're all clearly doing our own thing. I would ensure that trails are clean and accessible for everyone first and foremost, 2nd I'd like us all come together on essentially a uniform idea on lanes and spacing. are the sidewalks not comfortable enough or wide enough that walkers or runners are using the lanes for cyclists- is there enough lane space for cyclists and connecting paths to get to different points of interest  throughout the city. Are they protected and will drivers and cyclists and pedestrians all understand their roles when interacting with each other
          bike-infrastructure: |
            Yes unequivocally yes. Vision 0 goes hand in hand with this. Its a slam dunk win. Yes
          health-environment: |
            Its intrinsically linked. Cardiovascular health from either being sedentary or moving, breathing in pollution or clean air. The roads we pave aren't good for the environment, think of all the other associated side effects from relying on cars and the type of transportation we need ( oil consumption, infrastructure investment) it's tied to our mobility on that local or global scale - how do we get around and how do we want to get around. It tends to revolve around convenience
          land-use: |
            I do like what the city did in regards to the go station at fairview. Condos over the gotrain, located beside a grocery store, parks, arenas and down the street to the mall, and then close to the highway. You can really think about the different ways you can get around just from that one convenient hub. I love the idea of rational thought in getting people around, and building something that had close amenities. You could go from your apartment to the jays game without ever needing a car. Getting to the airport without a car. I love the idea of highlighting public transit here. I want more land pattern uses such as these in urban areas. And more trails in suburban areas.
      - name: "Frank Domenic"
        website: "https://frankdomenic.ca/"
        status: on-time
        received: "September 25, 2026"
        scores:
          ambition: 1.5
          money: 1
          network: 2
          health: 2.5
        responses:
          transport-mode: |
            I mostly drive my hybrid plug in minivan
          transit: |
            We need more connecting nodes on our transit lines. Too many transit stops strand people without ways to connect to other parts of the city. Increased ridership needs increased mobility and access.
          vision-zero: |
            I believe the city has been moving towards Vision Zero, but in that endeavour has not always made the best choices for overall commuter experience, for cyclists, pedestrians, and drivers alike. We should continue towards Vision Zero with a holistic approach in mind, not one defined by dogma.
          safety-investment: |
            For car infrastructure, more charging stations at parking facilities is helpful to encourage e-vehicle adoption. For other transportation, we need to look at routes which connect the various areas of town to ensure people can get to where they need to go, without the inconvenience of multiple transfers which could be solved with more accessible routes.
          walking-cycling: |
            One of the largest issues I've noticed walking all through Ward 6 is tree coverage. Our bus stops lack shelter and shade, our sidewalks are fully exposed. This makes the walking experience extremely uncomfortable, which people then avoid when they could otherwise do so. The city needs to hasten its replacement of trees, the waitlist is too long, and we need to add trees to undershaded areas.
          bike-infrastructure: |
            Bollards and protective measures for cyclists is important not just for cyclists but for pedestrians and drivers. We need to fix our comms on that. It's not just about supporting it as individuals, but the city needs to show and explain the value behind these improvements.
          health-environment: |
            We know the impact of fossil fuels on the environment. We also know the impact on children. Adoption of greener transportation cleans our air and creates a better future citizen. IQ rates rose when we removed lead from gas. The switch to EVs will similarly create a future where less children experience asthma and pollution related distress.
          land-use: |
            The entrenched suburban planning of southwestern Ontario has made changes to this a challenge. Where it's possible we need to change how land is utilized to encourage walking. More access to walkable swimming pools, skating rinks, and seniors centers, means less people driving to recreation, and more recreation access for families.
      - name: "Rowen Fraser"
        website: "http://www.rowrowforcouncil.com"
        status: on-time
        received: "September 22, 2026"
        scores:
          ambition: 4
          money: 1
          network: 2
          health: 1.5
        responses:
          transport-mode: |
            Currently I use my vehicle or walking to get most places.
          transit: |
            With the new ARGO transit pilot project around the corner, and its success in other municipalities, we can expect to see new on-demand transit features increase our ridership by several percent. With this pilot we will need to look at reshaping the regular routes in the city to better service main arteries while leaving residential pickups to our feeder services. The service in 5 years will look very different than it does today.
          vision-zero: |
            Burlington loves to run vision zero studies at the expense of taxpayers. I often hear Vision Zero as if it represents some sort of real change. The only thing I have seen Vision Zero accomplish is lining the wallets of the consultants who do the traffic studies. The latest Vision Zero study will cost taxpayers $300k and isn't due until Q4 2027. With that $300k I could be installing traffic safety features that will save lives now. Problems cannot be resolved by study, we need action. Vision Zero's goal is admirable, but I have not seen it take the steps for concrete action necessary to prevent the deaths it is supposed to be combating.
          safety-investment: |
            Road safety is one of my primary concerns in my campaign. We have access to new technologies and mobility devices. These devices need proper regulation so that their riders may be held accountable for their actions on our roads. For vehicle traffic we need a centralized command so that the City, Region, and MTO can share their data in real-time. For cycling and micromobility we need seperated and purpose built infrastructure that increases the viability of non-vehicle options, especially in the warmer months. For transit we need to focus on optimizing existing routes to embrace an on-demand feeder service to turbo charge our ridership numbers.
          walking-cycling: |
            I will advocate for a major expansion of separated cycling infrastructure to form a north/south artery for cyclists so they can safely cross the 403. I already have a major project proposal from local cycling advocate Joshua Boniface. I will attach it to this email. This is a preliminary plan and the expected costs could change significantly from the estimates.
          bike-infrastructure: |
            Because of the negative effect of protected cycling lanes on major traffic arteries I am advocating for separated infrastructure. This would increase cyclist safety and reduce congestion on major arteries here in Burlington. It may cost slightly more, but the end results are safer roads for everyone and no price can be put on that.
          health-environment: |
            Transport has a massive effect on our day to day lives. Vehicle transport is a leading contributor of GHGs in the atmosphere, but it is the most popular here in Burlington. If we are going to make the switch to transit and active transport it will be our responsibility to make those options attractive. Right now we do not create the infrastructure to make this the case. I intend to change that over the next 4 years. Obviously active transport has the best benefit to our cardiovascular health, while vehicle transport represents the convenience option.
          land-use: |
            In Burlington there are no major land use policies that can be changed that would have the desired effect on our transport. We must use other methods.
      - name: "Osob Adus"
        website: "https://www.osobward6.ca/"
        status: late
        received: "October 5, 2026"
        scores:
          ambition: 3.5
          money: 2.5
          network: 2
          health: 2.5
        responses:
          transport-mode: |
            I drive, walk, and use a bike when it makes sense for where I am going and when it is not winter. I know that a car is still essential for many families, especially in North and Rural Burlington.

            But having a car should not mean you feel unsafe walking across a road, getting to a bus stop, or letting your child walk or bike to a park.

            I don't think Burlington needs a fight over how people get around. We need a transportation system that works for the way people live.
          transit: |
            I want transit to be something people can depend on, not something that looks good on a route map or a check box.

            I would focus on frequency, reliability, evening and weekend service, connections to GO, and ensuring people can safely get to and from a bus stop. A bus stop is not accessible if getting to it means walking along an unsafe road or crossing where you shouldn't have to.

            As Burlington grows, transit needs to grow with it. I don't want us approving thousands of new homes and then asking how we will move all those people afterward. Regional governments must work together to make this happen. Ward 6 is surrounded by major routes managed by Halton Region.

            Transportation infrastructure must arrive with growth, not chase it. It also needs to be innovated.
          vision-zero: |
            I support Vision Zero. But I don't think putting the words "Vision Zero" on a document makes our streets safer.

            I want us to identify the places where people are getting hurt, or where the design of a road is creating a dangerous situation, and deal with those places first.

            That means looking seriously at intersections, crossings, school areas, speeding, visibility, lighting and road design. It also means listening to residents. They often know which intersection makes them nervous before a spreadsheet tells us there is a problem.

            I would like to see an annual public report that tells residents what we fixed, where we spent the money and whether it made a measurable difference.

            If we are serious about Vision Zero, let's measure it.
          safety-investment: |
            Yes, I am prepared to vote for transportation investments that make people safer.

            However, I will also ask serious questions before voting to spend the money. What problem are we solving? Who benefits? What will it cost to maintain? Is there a better solution? And how will we know whether it worked?

            I don't see transportation as cars versus bikes versus pedestrians. A Burlington resident can be a driver in the morning, a pedestrian at lunch and a transit rider that evening.

            My job as a councillor is not to pick a side. It is to make sure the system works.
          walking-cycling: |
            I want walking and cycling to be realistic options, not an obstacle course.

            That means filling gaps in sidewalks and cycling routes, making crossings safer, improving lighting and making connections to schools, parks, shopping and transit actually make sense.

            We also need to deal with the barriers we don't control on our own. Burlington has provincial highways and rail corridors that can divide neighbourhoods. I would expect the City to be at the table with the province and Metrolinx advocating for safe crossings and better connections.

            And I would not pretend that every part of Burlington needs the same solution. What makes sense downtown may not make sense in Rural Burlington.

            Good transportation planning starts with the place, not the template that creates a perception that one rule applies to all.
          bike-infrastructure: |
            Yes, I support expanding bicycle infrastructure where it makes sense and where it improves safety.

            But I don't want to build a beautiful piece of cycling infrastructure that takes people nowhere.

            I would rather see us finish meaningful connections, improve dangerous intersections and protect people where speed and traffic volumes create real risk.

            I also think we need to be honest about Burlington's geography. We have urban neighbourhoods, suburban communities and rural roads. The answer cannot be one design repeated across the whole city. It is incredibly expensive to create infrastructures and must be well measured.

            Build it where it solves a problem, connect it properly, and make it safe.
          health-environment: |
            Transportation is not just about getting from A to B. It affects our health, our neighbourhoods, our air, congestion and how much time people spend sitting in traffic.

            If someone can safely walk to a park, school, coffee shop or bus stop instead of getting in the car, that's a good thing. If someone can cycle safely, that's a good thing. If someone needs their car to get to work or take care of their family, that is also a reality we must respect.

            I don't want to tell Burlington residents how they should live. I want to give people better choices.

            The best transportation system is one that gives people options instead of forcing them into one.
          land-use: |
            Absolutely. I think we have sometimes treated land use and transportation as two separate conversations when they are really the same conversation.

            Before we approve significant growth, I want to know how people are going to get in, get out and move around once they are there.

            Where are the buses? Where are the sidewalks? Where will people cross the road? What happens at the nearest intersection? Can children get to school safely? What happens during a heavy rain? What happens during the morning commute?

            I am not against growth. I am against pretending that infrastructure will somehow catch up afterward.

            We need to build neighbourhoods where people have choices, while recognizing that Ward 6 includes very different communities, from Alton and Millcroft to Headon Forest and Rural Burlington.

            Before we add the people, let's make sure we are ready to support them.
      - name: "Angelo Bentivegna"
        status: no-response
