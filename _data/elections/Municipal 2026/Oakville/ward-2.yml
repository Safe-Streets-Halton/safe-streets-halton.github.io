# Oakville Ward 2
#
# One file per page. A page has one or more races (Oakville wards have two). Each race lists its candidates.
# Candidates are shown alphabetically by name, whatever order they are listed in here.
#
# Example race with every field filled in (copy it, then delete the leading "# "):
#
# races:
#   - id: race-ward                 # Unique on the page. Used for links and "Jump to" anchors.
#     title: Ward Councillor        # Heading for the race (shown only when the page has two or more races).
#     note: Sits on Burlington City Council and Halton Regional Council.   # Short line under the heading.
#     candidates:
#       - name: Jane Example        # Required.
#         website: https://example.com    # Optional. Campaign website; omit the line if none.
#         status: on-time             # on-time | late | late-pending | no-response
#                                     #   on-time       responded by the deadline, scored
#                                     #   late          responded after the deadline, scored and posted
#                                     #   late-pending  responded after the deadline, not yet scored or posted
#                                     #   no-response   did not respond
#         received: October 2, 2026   # Date the response arrived, as text. Optional for no-response.
#         scores:                     # 0 to 4 each. Only for on-time and late. Leave the whole block out for
#                                     # no-response and late-pending, and also for an on-time or late candidate
#                                     # whose response is still being scored: the page then shows "Rating in progress"
#                                     # and their answers, and the scores appear once you add this block.
#           ambition: 3
#           money: 2                  # Where the Money Goes
#           network: 4                # A Network for Everyone
#           health: 3                 # Health and Environment
#         responses:                  # Keyed by question id from questions.yml. Use "|" for the text.
#           transport-mode: |         # A blank line starts a new paragraph.
#             First paragraph of the answer, exactly as submitted.
#
#             Second paragraph.
#         sent: October 5, 2026       # Optional, no-response only: when the survey was sent ...
#         followed_up: October 12, 2026   # ... and when we followed up. Both optional.
#         open: true                  # Optional. Show this candidate expanded when the page loads.
#
# A ward with no responses yet: leave "candidates: []" and the page says nothing has been posted.

races:
  - id: race-regional
    title: "Regional & Town Councillor"
    note: "Sits on both Oakville Town Council and Halton Regional Council."
    candidates:
      - name: "Zena Al-Mudaris"
        status: late
        received: "October 5, 2026"
        scores:
          ambition: 4
          money: 3
          network: 3.5
          health: 3.5
        responses:
          transport-mode: |
            I am not an either-or person when it comes to transportation. I use the option that makes the most sense for the trip, and I want Oakville residents to have that same choice.

            I use a combination of transportation options depending on my destination, the cost, and the time available. I drive when it is the most practical option, but I also walk or use public transit when those choices are convenient and make sense for the trip.

            I believe Oakville should provide residents with real transportation choices. We should not assume that everyone can or should use the same mode for every trip. My goal is to support a transportation system where residents can choose the option that is safe, reliable, accessible and practical for their circumstances.

            As a Councillor, I would support a balanced transportation system that recognizes the importance of cars while making transit, walking and cycling increasingly practical alternatives.
          transit: |
            Oakville Transit needs to grow with Oakville. Ridership is already increasing — Oakville Transit recorded more than five million boardings in 2025, about three per cent higher than 2024. The Town has also begun implementing a Frequent Transit Network, including improved service on Trafalgar and Dundas.

            I would prioritize frequency, reliability, direct connections and longer service hours, rather than simply adding routes. Residents should not have to wait excessively long or make several transfers for relatively short trips.

            For Ward 2, I would focus on better connections between neighbourhoods, Kerr Village, Speers Road, downtown Oakville, GO services and other major destinations. I would also advocate for better connections between Oakville Transit and regional transit.

            Accessibility must be built into the system from the beginning. Oakville already has a fully low-floor conventional bus fleet and accessible care-A-van service, but accessibility also means accessible sidewalks, bus stops, shelters, crossings, winter maintenance, clear information and safe connections to and from the bus stop.

            I would measure success not simply by how many buses we operate, but by wait times, on-time performance, ridership, accessibility and customer experience.
          vision-zero: |
            Oakville has made meaningful progress, but I do not believe we are finished. The Town has established a Neighbourhood Traffic Safety Program that includes traffic calming, pedestrian crossings, Community Safety Zones, reduced default speed limits and Vision Zero measures.

            However, Vision Zero should not be treated as a slogan. The objective must be to systematically reduce the likelihood that a mistake results in death or serious injury.

            If elected, I would support:

            • safer pedestrian crossings and shorter crossing distances;

            • traffic calming where speed and collision data justify it;

            • better lighting and visibility;

            • protected cycling facilities where appropriate;

            • safer intersections;

            • speed management around schools, parks and neighbourhoods;

            • better winter maintenance of sidewalks and active transportation routes;

            • regular public reporting of serious and fatal collisions; and

            • designing roads according to a Safe System approach, where human error is expected and the road is designed to reduce the consequences.

            Oakville's automated speed-enforcement program was ended in November 2025 because provincial legislation prohibited municipal speed cameras, so the Town needs to use the tools that remain available — engineering, street design, traffic calming, enforcement partnerships and education.

            I would also look at successful approaches used in cities such as Toronto, Ottawa, Vancouver and internationally in places such as Sweden, while adapting them to Oakville's suburban environment.
          safety-investment: |
            Yes. I am prepared to vote for transportation investments that demonstrably improve safety.

            But I would apply a balanced and evidence-based approach. Oakville residents deserve good roads and efficient movement of vehicles, but transportation investment should not be measured only by how quickly we can move cars.

            When considering a transportation project, I would look at:

            1. safety;

            2. cost and long-term value;

            3. traffic and congestion;

            4. transit performance;

            5. accessibility;

            6. walking and cycling connections;

            7. environmental impact; and

            8. the needs of residents, businesses and emergency services.

            Oakville's new Transportation Master Plan is already moving toward a more multimodal system, with more than 300 recommendations covering streets, transit, active transportation, accessibility and transportation demand management.

            My principle would be simple: we should invest where the evidence shows that an investment makes Oakville safer, more connected and better prepared for growth — not simply build more road capacity by default.
          walking-cycling: |
            Walking and cycling should be realistic transportation options, not just recreational activities.

            I would support completing connected networks, rather than building isolated pieces of cycling infrastructure. A protected bike lane that suddenly ends at a dangerous intersection does not provide the safety residents need.

            For Ward 2, I would prioritize safe connections around Kerr Street, Speers Road, Rebecca Street, Fourth Line, Kerr Village and the West River neighbourhood, together with connections to downtown, transit and GO.

            I would also prioritize:

            • safer intersections;

            • protected crossings;

            • wider and accessible sidewalks;

            • better lighting;

            • year-round maintenance;

            • curb ramps and tactile surfaces;

            • safe cycling connections to transit;

            • secure bicycle parking; and

            • better wayfinding.

            Where highways, rail corridors or other major roads create barriers, I would work with the Town, Halton Region, Metrolinx and the Province to create safe crossings rather than accepting those barriers as permanent.

            This is already reflected in Oakville's transportation planning. The Town's active transportation update specifically identifies the need to upgrade some older cycling facilities and create more direct connections across barriers.
          bike-infrastructure: |
            Yes — where the evidence and road conditions support it.

            I support expanding protected cycling infrastructure, particularly on roads with higher traffic volumes and speeds. The goal should not be to put the same design everywhere; it should be to use the right design for the right road.

            That can include protected bike lanes, cycle tracks, multi-use paths, traffic-calmed neighbourhood streets and protected intersections.

            Oakville has already demonstrated that protected infrastructure can work. The protected bike lanes on Speers Road between Third and Fourth Line provide separation from traffic and include a design that integrates transit stops.

            I would also insist that cycling infrastructure be designed with the safety of pedestrians and drivers in mind. Good design should reduce conflicts for everyone.

            For Ward 2, the priority should be completing connections rather than creating disconnected short sections.
          health-environment: |
            Transportation is both a mobility issue and a public-health issue.

            When people have safe opportunities to walk or cycle, they can incorporate physical activity into their everyday lives. Reliable transit can also improve access to employment, education, healthcare and community services, particularly for seniors, youth, people with disabilities and households that do not have access to a vehicle.

            Transportation also affects air quality, noise and greenhouse-gas emissions. I therefore support reducing unnecessary single-occupant vehicle trips by making transit, walking and cycling practical alternatives —not by telling people they cannot drive.

            For Oakville, the right approach is to provide choices. If someone can safely walk, cycle or take transit for a particular trip, the transportation system should make that choice convenient.

            That is consistent with Oakville's current Transportation Master Plan, which explicitly links transportation planning with health, climate change, accessibility and sustainable travel.
          land-use: |
            Yes. Transportation and land-use planning must be planned together.

            For decades, many suburban communities were designed around the assumption that almost every trip would be made by car. Oakville cannot change its existing neighbourhoods overnight, but we can make better decisions about future growth.

            I would support:

            • mixed-use neighbourhoods where appropriate;

            • housing closer to shops, services and transit;

            • safe pedestrian and cycling connections between neighbourhoods;

            • transit-supportive development around major transit corridors and GO stations;

            • a better mix of housing types;

            • connected street networks rather than isolated developments;

            • reduced dependence on large parking requirements where appropriate; and

            • requiring new developments to demonstrate how residents will safely access transit, walking and cycling.

            Importantly, I would not support simply adding density without the infrastructure to support it. Growth must come with roads, sidewalks, transit, parks, schools, drainage and other infrastructure.

            Oakville's current planning framework already identifies Midtown as a major transit-oriented growth area, while the Town's broader growth-management policy calls for complete mixed-use communities with access to retail, schools, recreation, greenspace and transit.

            For Ward 2, I would apply the same principle to redevelopment and intensification: growth should strengthen the existing community rather than overwhelm it.

            So in general, Oakville should not be forced to choose between cars and sustainable transportation. We need a transportation system that works for drivers, transit users, pedestrians, cyclists, seniors, families and people with disabilities.

            My three practical principles:

            1. Safety first

            No road project should be considered successful if it moves traffic faster but makes vulnerable road users less safe.

            2. Choice, not ideology

            Cars will remain essential in Oakville. The goal is to give residents more practical choices, not to punish people for driving or not driving.

            3. Value for taxpayers

            Every transportation dollar should be evaluated for safety, measurable benefit, lifecycle cost and long-term value.

            This positioning is particularly strong because it aligns with Oakville's recently approved Transportation Master Plan without simply repeating the Town's language. The TMP itself calls for a shift away from an auto-centric system toward a safe, connected, multimodal network through 2051.
