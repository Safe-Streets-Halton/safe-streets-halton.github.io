  - id: race-town
    title: "Town Councillor"
    note: "Sits on Oakville Town Council."
    candidates:
      - name: "Sana Waqar"
        website: "https://www.sanawaqar.ca/"
        status: on-time
        received: "September 26, 2026"
        scores:
          ambition: 4
          money: 3
          network: 4
          health: 2.5
        responses:
          transport-mode: |
            Mostly by car, like most families here. But I see our transit system every day through my daughter. She takes the bus home from Trafalgar to Speers, less than 8 km, and it takes her an hour and 45 minutes. She could walk it in about the same time. That isn't a transit system a family can rely on. It's why so many Oakville households feel they have no choice but to drive. Across Oakville, cars carry 85% of peak-hour trips, with transit at 8% and walking or cycling at 7%.
          transit: |
            My daughter's trip home is not unusual. She takes one bus down to Oakville GO, then waits to transfer to a second bus west to Speers, and the transfer is where the time disappears. The average transit commute in Oakville takes 55 minutes, about double the 27 minutes by car. Speers–Cornwall, the route serving the Speers corridor, runs every 30 minutes midday and only hourly in the evening. That's when students and shift workers are travelling. Ridership is growing anyway. Oakville Transit recorded 4.88 million boardings in 2024, with about 5.01 million projected for 2025. Riders' top complaints in 2025 were reliability, frequency and access to bus stops. In Ward 2, Route 14/14A Lakeshore West carries about 2,040 riders every weekday, but runs only every 30 minutes midday and in the evening, and customers have flagged it for crowding.

            I will push for 15-minute all-day service on Lakeshore and Speers, so a missed transfer costs minutes, not an hour. I'll press Metrolinx and the Region to advance the Harvester/Speers/Cornwall priority bus in the regional transportation plan. I'll protect free fares for youth and seniors. Ridership jumped 24% after they launched, and these riders now make up 37.7% of the total. On accessibility, only 82% of Oakville's 1,151 bus stops are accessible today. I'll publish every Ward 2 stop that isn't, with a completion date, in my quarterly Ward 2 Spending Scorecard.
          vision-zero: |
            At Kerr and Rebecca, the walk signal doesn't give people enough time to cross. Seniors, parents with strollers and kids from the neighbourhood are often still in the road when the light changes. That's the kind of fix Vision Zero is built on, and it's cheap: longer crossing times, and a leading walk signal that gives people a few seconds' head start before cars can turn.

            Oakville's progress is real but thin. Our plans say the Town recognizes the Vision Zero philosophy, but there is no dedicated plan with a target year and a public dashboard of deaths and serious injuries. Between 2014 and 2022, there were 4,972 collisions on Town roads, clustered in Kerr Village, Downtown, Bronte Village, and along Third Line, Speers and Trafalgar. Much of that is Ward 2.

            Signs alone don't work. Oakville's own 40 km/h pilot didn't reduce actual driving speeds. Our speed cameras launched in January 2025 and were shut off in November after Bill 56 banned them. The Province has since given the Town $891,274 in interim funding for safety measures at the former camera sites. I want that money spent on physical measures: raised crossings, speed cushions, leading walk signals and clear sightlines at corners. I'll also push for a formal Vision Zero plan with annual public results. It works elsewhere. Toronto estimates a 24% drop in serious-injury collisions since adopting its plan in 2016. Sweden cut traffic deaths per capita by 68% between 2000 and 2019.
          safety-investment: |
            Yes, I will vote for safety spending. My background is in government audits, where the first question is always simple: did the money deliver what was promised? Applied to Oakville, the answer is sobering. Our own plan admits that 62% of the improvements promised in the 2013–2018 transportation plans have not started. The same plan concedes that widening roads eases traffic only briefly, before new demand fills them again. My priorities are safety and connections first, with before-and-after results for every project reported in my Spending Scorecard. That includes restarting the Kerr Street underpass. Its cost rose from $130 million to $234 million and Metrolinx deferred it indefinitely. Any restart must keep the sidewalks and bike lanes in the design.
          walking-cycling: |
            I walk Kerr Village often, and it shows what works: shops, cafés and services close together on a real main street. The trouble is getting there. Many streets south of the QEW have no sidewalk at all, and crossings over the QEW/403 and Sixteen Mile Creek are typically 1.2 to 3.5 km apart. Lakeshore Road West has been in the Town's plans since 2009, yet the section from Bronte Athletic Park to Dorval Drive was dropped from the redesign indefinitely. Kerr Village should be walkable from the whole ward, not just the few blocks around it. I will publish a Ward 2 sidewalk-gap list with funding dates and put Lakeshore Road West back on the capital plan. I'll press for a walking and cycling crossing over Sixteen Mile Creek near Speers and the QEW. And whenever the Province rebuilds a QEW structure in our ward, I'll insist it includes safe crossings for people on foot and on bikes.
          bike-infrastructure: |
            Yes. My own family would cycle more if they felt safe doing it, and I hear the same from neighbours.

            The smartest first step is protecting lanes we already have. The Kerr Village and Bronte streetscape plans call for protecting the existing bike lanes on Lakeshore Road West from Forsythe Street to Dorval Drive, and the 2026 budget includes $8.1 million to begin streetscape work in Bronte and Lower Kerr Village. I'll see phase one through. One honest note: under Bill 212, a bike lane that removes a traffic lane now needs provincial approval. So I'll focus on separation that doesn't remove lanes, protected intersections whenever roads are rebuilt, and routes that connect to our GO stations.
          health-environment: |
            Through my medical training I have learned that the environment we build shapes our health more than any clinic visit. A street that's safe to walk is preventive medicine. Only 53% of Halton adults and 44% of older adults meet Canada's physical activity guidelines, and about 22% of Oakville residents live with a disability. Streets designed only for cars leave both groups behind.

            On climate, transportation produces almost half of Oakville's community-wide greenhouse gas emissions, and more than 70% of that comes from personal vehicles. Electric buses help. Every replacement bus since 2021 has been battery electric, with a fully electric fleet planned by 2033–37. The bigger gain is giving people real choices for the short trips they make every day.
          land-use: |
            I've knocked on more than 5,000 doors in Ward 2, and Midtown has come up at almost every one. Residents are worried about traffic, and the numbers say they're right. Midtown covers about 103 hectares and is expected to hold about a third of Oakville's 33,000-home pledge. The Town's conservative forecast is 29,900 residents and jobs by 2051. Its western edge is Sixteen Mile Creek, our ward's doorstep.

            The roads crossing that creek already carry the most traffic relative to their capacity of any in town. The Town's own forecasts show demand across the creek exceeding what the roads can handle by 2051. Meanwhile, the Kerr Street underpass that would ease pressure at the rail crossing sits deferred. Council voted yes on Midtown's growth before the transit and crossings to carry it were funded. I would not have.

            The deeper problem is how we've built. Most of Oakville's land is single detached homes, which makes walking or cycling to daily needs harder. Yet two-thirds of trips that stay inside Oakville are 5 km or less, and short car trips are especially common in Kerr Village and Downtown. My answer is not towers. New homes should fit the neighbourhood, with height stepping down toward existing streets. Transit, sidewalks and safe crossings should be funded before people move in, not after. And everyday services should be within walking distance.
      - name: "Ray Chisholm"
        website: "https://www.raychisholm.ca/"
        status: late
        received: "October 5, 2026"
        scores:
          ambition: 3.5
          money: 1
          network: 1.5
          health: 1.5
        responses:
          transport-mode: |
            I primarily use my car, but I also walk frequently, particularly within my own neighbourhood. I believe it is important that Oakville provides residents with a variety of safe, accessible, and practical transportation options so that people can choose what works best for their individual needs.
          transit: |
            As Oakville continues to grow, transit needs to grow with it. I would like to see stronger connectivity to newer areas of Oakville, along with ongoing assessment of where transit services are being used and where additional service is needed.

            Regular surveys and meaningful rider feedback should play an important role in shaping transit decisions. We need to listen to the people who use the system every day and respond to changing community needs.

            I also support continued investment in environmentally responsible vehicles, including electric buses, as well as improvements that make transit more accessible and comfortable. This includes more accessible seating, continued expansion of bike racks, and the use of kneeling buses to make boarding easier for seniors, people with disabilities, parents with strollers, and anyone who may have difficulty accessing a conventional bus.
          vision-zero: |
            Oakville has already taken meaningful steps toward improving road safety and creating a safer environment for pedestrians and other road users. The introduction of 24 pedestrian crossings, ladder style crosswalk markings at intersections, and advanced pedestrian signals are examples of measures that are already making a difference in our community.

            If re-elected, I would support continuing this progress and looking at where additional safety improvements are needed. That means continuing to identify areas of concern, improving crossings and intersections, considering traffic calming where appropriate, and ensuring that pedestrian and cyclist safety remains a priority when transportation decisions are made.

            Vision Zero is ultimately about creating a culture where serious injuries and fatalities are not simply accepted as an inevitable part of transportation. Oakville has made progress, and I believe we need to continue building on the work that is already underway.
          safety-investment: |
            Yes. As Oakville continues to grow, our transportation investments need to reflect the needs of a growing and changing community.

            I would support investments that improve safety for everyone using our roads, including drivers, pedestrians, cyclists, and transit users. This includes appropriate traffic calming measures, safer intersections and crossings, and continued investment in public transit.

            Cars will continue to be an important part of how many Oakville residents get around, but transportation planning should not focus exclusively on moving vehicles. We need to invest in a transportation network that gives residents safe and practical choices while keeping safety at the centre of our decisions.
          walking-cycling: |
            I support continued improvements to Oakville's cycling infrastructure, pedestrian pathways, and trail network. We should make it easier and more comfortable for residents to walk and cycle, whether they are commuting, running errands, or simply enjoying our community.

            That means continuing to improve bike lanes and pedestrian connections, identifying gaps in our existing network, and making sure routes connect people to the places they need to go.

            Provincial highways can create significant barriers to connectivity, and these challenges require cooperation between the Town, Halton Region, and the Province. I would support working collaboratively with all levels of government to identify safer crossings and better connections so that highways do not become barriers between neighbourhoods.

            We also need to ensure that all users understand and follow the rules of the road and trails. Appropriate enforcement and education around e bikes and e scooters is important.
          bike-infrastructure: |
            Yes. My support for improved cycling infrastructure is already reflected in the work that has been done in Oakville, including bike lanes on Rebecca Street and Speers Road.

            Cycling infrastructure is also included in the Town's transportation planning, and I fully support continuing to implement these improvements.

            The goal should be to create a connected transportation network where cyclists can travel safely and confidently, while also improving safety and predictability for pedestrians and drivers.
          health-environment: |
            Transportation has a direct impact on both our environment and our overall health and wellbeing. Encouraging more people to walk, cycle, and use public transit can help reduce emissions while also encouraging physical activity and healthier lifestyles.

            I support the continued transition toward electric buses and other greener transportation options. At the same time, we should make walking and cycling practical and accessible by investing in safe trails, sidewalks, bike infrastructure, and connections throughout our community.

            Our transportation decisions should consider both the environmental impact today and the kind of community we want to leave for future generations.
          land-use: |
            Cars will continue to be an important part of transportation in Oakville, and we should recognize that many residents will continue to rely on them for work, family responsibilities, and daily life. At the same time, we should be open to thoughtful changes in how we plan and build our communities so that residents have more transportation choices.

            As Oakville grows, I would support planning decisions that improve connectivity between neighbourhoods and make it easier for residents to access transit, walking routes, cycling infrastructure, parks, schools, and other community amenities.

            I believe the best approach is to remain open to new ideas and to consider how land use and transportation planning can work together. We should encourage development that supports a range of transportation options while recognizing the realities of a growing community. Ultimately, our goal should be to build neighbourhoods where people have the freedom to choose how they get around, rather than being entirely dependent on one mode of transportation.
      - name: "Ayesha Khawaja"
        website: "https://ayeshakhawaja.ca/"
        status: late
        received: "October 5, 2026"
        scores:
          ambition: 3.5
          money: 3
          network: 3
          health: 3.5
        responses:
          transport-mode: |
            I use a mix of transportation depending on where I am going. I drive for many of my daily responsibilities, but my children and I also sometimes use local buses. That gives me a personal perspective on transit—not only as a candidate discussing policy, but as a resident and a parent actually using the service.

            When travelling with children, things like frequency, waiting times, safe and comfortable bus stops, connections, and whether a route gets you reasonably close to your destination really matter. I also walk within my neighbourhood whenever practical. I believe residents should have choices in how they move around Oakville, whether they drive, take transit, walk, cycle, or use mobility devices.
          transit: |
            As Oakville grows, transit needs to grow with it. We cannot encourage people to use public transit if the service is not frequent, reliable, convenient, and accessible.

            From my own experience travelling on local buses with my children, I know that waiting and connection times can make a significant difference. I would like to see better frequency on high-demand routes, stronger connections between neighbourhoods and major destinations, and better coordination with GO Transit and neighbouring transit systems.

            I would also focus on the rider experience: safe and accessible bus stops, shelters and seating where appropriate, clear real-time information, reliable schedules, and accessibility for seniors, people with disabilities, parents with strollers, and residents with mobility challenges.

            Transit should not simply exist; it needs to be practical enough that residents genuinely consider it an alternative to driving.
          vision-zero: |
            Oakville has taken important steps toward safer streets, but Vision Zero should ultimately be measured by outcomes—not simply by having a plan. If residents are still telling us they are afraid to cross certain streets, that vehicles regularly speed through their neighbourhoods, or that children cannot safely walk or cycle to school, then there is more work to do.

            I support a data-driven approach that identifies locations with collisions, speeding concerns, dangerous crossings, and vulnerable road users. Measures can include traffic calming, safer pedestrian crossings, improved lighting where appropriate, reduced speeds in sensitive areas, better intersection design, and stronger enforcement.

            I would pay particular attention to school zones, parks, seniors' facilities, transit stops, and residential streets. We should also learn from municipalities that have successfully redesigned streets so that safe behaviour is encouraged by the physical design of the road itself.

            My approach would be simple: no family should have to experience a tragedy before we decide that a street or intersection needs to be made safer.
          safety-investment: |
            Yes. I am prepared to support transportation investments that have a clear safety benefit and provide good value to residents.

            I do not believe transportation should be framed as drivers versus cyclists, pedestrians, or transit riders. Many of us are several of those things in the same week. I may drive one day, take a bus with my children another day, and walk through my neighbourhood later that evening.

            I would evaluate transportation investments based on safety, accessibility, evidence, community need, long-term value, and financial responsibility. Where evidence shows that an investment can prevent serious injuries, improve accessibility, or make our transportation network work better, I would be prepared to support it.
          walking-cycling: |
            Walking and cycling need to feel safe and practical, not like an afterthought. That means maintaining sidewalks and trails, creating safer crossings, improving connections between trails and neighbourhoods, providing appropriate lighting, addressing missing sidewalk links, and designing intersections with pedestrians and cyclists in mind.

            A trail or bike lane is much less useful if it suddenly ends or leaves someone at a dangerous crossing. We therefore need to look at connectivity across the entire journey.

            Provincial highways and other infrastructure outside the Town's direct control create additional challenges. In those situations, Council should actively advocate and work with the Province, Halton Region, and other responsible agencies rather than simply saying that it is outside municipal jurisdiction.
          bike-infrastructure: |
            Yes, I support expanding safe cycling infrastructure where it is supported by evidence, appropriate to the road, and designed as part of a connected transportation network.

            Protected infrastructure can be particularly valuable on roads where traffic speed and volume make cycling uncomfortable or unsafe. I also support safer intersections, traffic calming, and appropriate lower-speed environments in areas with high pedestrian and cycling activity.

            At the same time, implementation should be thoughtful. We should look at road conditions, emergency access, transit operations, local businesses, residents, traffic flow, and actual usage. The objective should not simply be to count kilometres of bike lanes; it should be to build infrastructure that people can safely and practically use.
          health-environment: |
            Transportation has a direct impact on both public health and our environment. When communities make walking, cycling and public transit safe and convenient, people have more opportunities to incorporate physical activity into everyday life. It can also reduce traffic congestion, vehicle emissions, noise, and pressure on our road network.

            There is also a social and financial dimension. Not every resident owns a vehicle or can drive. Young people, seniors, people with disabilities, newcomers, students, and families facing financial pressures may depend much more heavily on transit and walkable communities.

            A good transportation system therefore supports health, environmental sustainability, affordability, independence, and social inclusion at the same time.
          land-use: |
            Yes. Transportation and land-use planning have to work together. If we build communities where homes are far away from shops, schools, services, parks and transit, we create car dependency by design.

            As Oakville grows, I support directing appropriate growth toward areas that already have—or can realistically support—strong transit and infrastructure. We should encourage complete communities where residents can reach more of their everyday needs by walking, cycling or transit.

            At the same time, responsible growth means recognizing that infrastructure must keep pace with development. Adding density without adequate transit, roads, schools, parks, emergency services, and other infrastructure simply creates new problems.

            My goal is not to force people out of their cars. It is to give residents meaningful choices. A successful transportation system is one where driving remains possible, but taking transit, walking, or cycling is also safe, accessible and practical.
