# Oakville Ward 4
#
# One file per page. A page has one or more races (Oakville wards have two). Each race lists its candidates.
# Candidates are shown alphabetically by name, whatever order they are listed in here.
#
# Example race with every field filled in (copy it, then delete the leading "# "):
#
# races:
#   - id: race-ward                 # Unique on the page. Used for links and "Jump to" anchors.
#     title: Ward Councillor        # Heading for the race (shown only when the page has two or more races).
#     note: Sits on Burlington City Council and Halton Regional Council.   # Short line under the heading.
#     candidates:
#       - name: Jane Example        # Required.
#         website: https://example.com    # Optional. Campaign website; omit the line if none.
#         status: on-time             # on-time | late | late-pending | no-response
#                                     #   on-time       responded by the deadline, scored
#                                     #   late          responded after the deadline, scored and posted
#                                     #   late-pending  responded after the deadline, not yet scored or posted
#                                     #   no-response   did not respond
#         received: October 2, 2026   # Date the response arrived, as text. Optional for no-response.
#         scores:                     # 0 to 4 each. Only for on-time and late. Leave the whole block out for
#                                     # no-response and late-pending, and also for an on-time or late candidate
#                                     # whose response is still being scored: the page then shows "Rating in progress"
#                                     # and their answers, and the scores appear once you add this block.
#           ambition: 3
#           money: 2                  # Where the Money Goes
#           network: 4                # A Network for Everyone
#           health: 3                 # Health and Environment
#         responses:                  # Keyed by question id from questions.yml. Use "|" for the text.
#           transport-mode: |         # A blank line starts a new paragraph.
#             First paragraph of the answer, exactly as submitted.
#
#             Second paragraph.
#         sent: October 5, 2026       # Optional, no-response only: when the survey was sent ...
#         followed_up: October 12, 2026   # ... and when we followed up. Both optional.
#         open: true                  # Optional. Show this candidate expanded when the page loads.
#
# A ward with no responses yet: leave "candidates: []" and the page says nothing has been posted.

races:
  - id: race-regional
    title: "Regional & Town Councillor"
    note: "Sits on both Oakville Town Council and Halton Regional Council."
    candidates:
      - name: "Roger Lapworth"
        website: "https://lapworth.ca/"
        status: on-time
        received: "October 4, 2026"
        scores:
          ambition: 3
          money: 0.5
          network: 0.5
          health: 1
        responses:
          transport-mode: |
            Automobile.
          transit: |
            More bus shelters, More routes, More smaller unit buses to take Seniors etc. to & from medical appointments.
          vision-zero: |
            Stronger speed enforcement on all major town and all regional roads.  More speed reductions monitors around school and senior home zones and all of the Regions BIAs.  Reduce to 30 kph at all school zones. Stronger enforcement of "STOP" signs and "RIGHT TURN ON RED".  Both of these are being substantially abused.
          safety-investment: |
            YES!! and throughout the Region of Halton.
          walking-cycling: |
            We need more enforcement to keep bicycles OFF the sidewalks.  The same goes for these new electric scooters etc. Cyclists must keep to the single file rule and they and pedestrians must obey all of the rules of the road.  Same for electric scooter users.
          bike-infrastructure: |
            YES!! and throughout the Region of Halton.
          health-environment: |
            Almost everybody is in a rush to get to their destination. This is not good for their health. Electric vehicles (zero emissions) should see some improvement in the overall air quality. During and after Covid 19 many employees worked from their respective homes.  This eliminated a lot of travel time to and from their places of work.  This seems to be wearing off now, so any health benefits gained then will probably be lost today. More road infrastructure, wider roads, more HOV lanes etc will hopefully reduce traffic congestion.  Looking forward if space financial support is available I would like to see a TRUCKS only lane on certain highways.  The QEW and Hwy 403 would be a great place to start.
          land-use: |
            All I can offer here is that in any new large subdivision the roads should be wide enough for bus access so that nobody has to walk more that a  hundred yards to get to public transit.
      - name: "Suzan Chong"
        website: "http://www.suzanchong.ca"
        status: on-time
        received: "September 20, 2026"
        scores:
          ambition: 2.5
          money: 1
          network: 3
          health: 2.5
        responses:
          transport-mode: |
            I mostly drive my EV, and I rely a lot on the 407 to get across the region.
          transit: |
            We need transit that actually makes sense for daily life. For me, that means better, more reliable connections between local Oakville routes and the larger regional networks so people aren't forced to drive. It has to be practical and accessible, especially for families trying to get to local activities.
          vision-zero: |
            We still have a long way to go to eliminate serious traffic injuries. I recently started a petition for traffic calming on my own street in Ward 4 and worked directly with the town's Neighbourhood Traffic Safety team. However, infrastructure alone isn't a silver bullet. On Pilgrims Way, even with newly installed traffic calming measures, we are still seeing dangerous habits during school drop-offs—like U-turns right next to crossing guards and vehicles parking in bike lanes, which completely blocks sightlines for families trying to cross. Reaching Vision Zero requires a comprehensive approach: we need the physical infrastructure, but we also desperately need visible Halton Regional Police presence during peak hours for proactive education, better sign support for our crossing guards, and a commitment from neighbours to keep active routes clear.
          safety-investment: |
            Yes, I'd absolutely vote to prioritize safety over just moving cars. My push for traffic calming in my own neighbourhood shows where I stand on this. We need to fund streets that are safe and livable for residents, rather than just building roads designed to move vehicles as fast as possible.
          walking-cycling: |
            People will only walk or bike if they genuinely feel safe doing it. In Ward 4, we have excellent local trail networks running through Glen Abbey, like the Taplow Creek or McCraney Creek trails, but they frequently hit massive barriers—whether it's the QEW to the south or busy arterials like Upper Middle Road and Third Line. We desperately need dedicated, safe crossings, like pedestrian bridges or underpasses, so our paths don't just dead-end at fast-moving provincial highways. We have to ensure residents can safely connect across the entire ward without feeling stranded.
          bike-infrastructure: |
            Yes, I completely support expanding this infrastructure. But it has to be done right. As we see during school drop-offs on Pilgrims Way, just painting a bike lane isn't enough if people are going to park in it and use it as a drop-off zone. We need protected bike lanes, slower residential roads, and safer intersections so that everyone sharing the road is actually protected and our active routes remain completely clear for walking and cycling students.
          health-environment: |
            It's all connected. Supporting EV charging infrastructure, getting cars off the road, and making it easier to walk or bike means cleaner local air and a smaller global carbon footprint. It’s simply a healthier way to build a community.
          land-use: |
            We need to build complete neighbourhoods where you don't need a car just to run a simple errand. In ward 4 that is issue where Palermo and Bronte Creek residents need to drive to go get a coffee or grocery shopping. For some it is easier for them to go Fortinos in Burlington than try to go across town to the Sobeys in Oakville. If we mix residential areas with local shops and services, walking or biking becomes the easy, natural choice, which directly addresses the historical land-use issues that have forced people to drive everywhere.
      - name: "Vandana Giri"
        website: "https://vandanagiri.com/"
        status: on-time
        received: "October 4, 2026"
        scores:
          ambition: 1.5
          money: 2.5
          network: 2.5
          health: 2.5
        responses:
          transport-mode: |
            I prefer walking when a place is within walking distance. For longer trips, I use other transportation depending on where I need to go.
          transit: |
            I think transit should be easier, safer, and more reliable for everyone. I would like to see better bus connections, more frequent service, safer bus stops, and better accessibility for seniors and people with disabilities.
          vision-zero: |
            Oakville has made some progress, but there is still more work to do. I would support safer intersections, slower speeds in busy areas, better crossings, and traffic calming near schools, parks, and neighbourhoods.
          safety-investment: |
            I would support transportation spending that makes travel safer for everyone, including drivers, pedestrians, cyclists, and transit users. Investments should not only focus on cars.
          walking-cycling: |
            I would support better sidewalks, safer crossings, protected bike lanes, good lighting, and regular maintenance. The Town should also work with the Province to make it safer to cross areas near major highways.
          bike-infrastructure: |
            Yes, I support expanding bicycle infrastructure. Protected bike lanes and safer intersections can help make roads safer for cyclists, pedestrians, and drivers, while giving people more choices for getting around.
          health-environment: |
            Transportation affects air quality, traffic, and people’s health. Making it easier to walk, cycle, and take transit can reduce pollution and help people live more active lives.
          land-use: |
            I would support land-use planning that makes it easier for people to live closer to shops, schools, parks, and transit. This can give residents more choices and reduce the need to drive for every trip.
      - name: "Hutchison Lee"
        website: "https://www.hleeforward4.ca/"
        status: late
        received: "October 5, 2026"
        scores:
          ambition: 4
          money: 2.5
          network: 4
          health: 4
        responses:
          transport-mode: |
            I use a dual approach to personal mobility: an electric vehicle for short daily trips and local errands within Oakville, and an Audi SUV for longer distance driving.
          transit: |
            I envision Oakville Transit and Halton Region transit expanding through smart, demand-responsive networks that seamlessly connect residential neighbourhoods to key hubs, such as GO Transit stations, employment corridors, and community centres.

            Key Improvements & Rider Experience:

            - Protecting & Expanding Zero-Fare Policies: I strongly support maintaining Oakville’s policy offering free transit for youths (0–19) and seniors (65+) with a PRESTO card. At the Regional level, I will advocate to expand seamless zero-fare cross-boundary travel across neighboring Halton municipalities (Burlington and Milton) so youth and seniors can move freely across our region without fee barriers.

            - Accessibility & Shelter Infrastructure: Upgrading bus stops with universal accessibility features (paved pads, low-floor bus interfaces, tactile paving) and weather shelters to ensure dignity, safety, and comfort for seniors, riders with disabilities, and families year-round.

            - Technology & Fare Integration: Supporting real-time GPS arrival tracking and expanding regional fare-integration programs (such as the Ontario One Fare Program for GO Transit connections) to make transit intuitive and cost-effective.
          vision-zero: |
            Oakville has taken positive initial steps through its Neighbourhood Traffic Calming policy and school zone safety initiatives, but there remains significant progress to be made as our roads become busier. True Vision Zero requires moving beyond reactive measures toward proactive street engineering and data-driven enforcement.

            Measures I Support:

            - Targeted Traffic Engineering: Implementing proven physical interventions, such as raised crosswalks, pedestrian refuge islands, pinch points, paired with clear digital speed feedback displays to change driver behaviour.

            - Leading Pedestrian Intervals (LPIs): Giving pedestrians a 3-to-7-second head start at signalized intersections before turning vehicles get a green light—a low-cost, high-impact measure proven in cities like Toronto and New York to drastically reduce pedestrian-vehicle collisions.
          safety-investment: |
            Yes, I am fully prepared to support balanced budget investments that measurably enhance public safety and mobility for all road users.

            Transportation funding should not be a zero-sum debate between drivers and non-drivers. My priority is complete, safe, and efficient mobility. This includes funding zero-fare transit initiatives for youth and seniors, which reduces household expenses, encourages sustainable transit habits early, and keeps senior residents active and connected. I will vote in favour of budget allocations that prioritize safety retrofits, active transportation corridors, transit fare affordability, and smart traffic technology alongside necessary road maintenance.
          walking-cycling: |
            Oakville already boasts an exceptional trail system, but critical network gaps—particularly across major barriers like the QEW and Highway 407—severely restrict active travel across town.

            Key Initiatives:

            - Closing Network Gaps: Prioritizing missing sidewalk links and connecting disconnected multi-use trail segments across Ward 4 to ensure continuous, safe corridors for pedestrians and cyclists.

            - Overcoming Highway Barriers: Advocating strongly at the Regional and Provincial (MTO) levels to incorporate dedicated, physically separated active transportation crossings (grade-separated overpasses or widened, protected underpass sidewalks) during all future QEW and 407 interchange upgrades.

            - Maintenance & Year-Round Accessibility: Ensuring municipal trail and sidewalk winter maintenance programs prioritize key active transportation routes to schools and transit stops, making walking and cycling viable options year-round.
          bike-infrastructure: |
            Yes, I support the context-appropriate, strategic expansion of protected active transportation infrastructure.

            Where higher-speed arterial roads carry heavy vehicular traffic, physically separated multi-use paths (MUPs) or protected bike lanes are essential to prevent fatal interactions. On quiet, internal residential streets, lowering speeds through traffic calming and neighborhood greenway designs creates a safe, shared environment without needing heavy physical barriers. The right approach is to apply the right tool to the right street context to maximize safety without creating unnecessary traffic bottlenecks.
          health-environment: |
            Transportation directly impacts both public health and environmental sustainability:

            - Public Health: Active transportation (walking, cycling, rolling) incorporates physical movement into daily routines, reducing rates of cardiovascular disease, stress, and obesity. Furthermore, safer road design reduces the burden of traffic injuries on our regional healthcare systems.

            - Local & Global Environment: Transportation accounts for a substantial portion of local greenhouse gas emissions and micro-air pollutants. Transitioning toward electric vehicles, expanding public transit usage, and enabling active transportation options reduce carbon footprints, improve local air quality, and help preserve Oakville’s natural canopy and trail ecosystems for future generations.
          land-use: |
            While Ward 4 is largely established with traditional single-family and townhouse developments, future land-use planning must embrace 15-to-20-minute complete neighbourhood principles:

            - Transit-Oriented Development (TOD) at Key Hubs: Directing sensible, mixed-use growth directly along designated transit corridors and arterial nodes (e.g., Palermo Village, transit hubs), ensuring commercial services, retail, and transit are within walking distance of higher-density housing.

            - Neighborhood Commercial Integration: Supporting small-scale, neighborhood-serving commercial uses (such as small grocery outlets, cafes, or medical clinics) within walking distance of residential areas to eliminate short car trips for daily necessities.

            - Protecting Established Residential Character: Balancing transit-oriented land-use changes by preserving the low-density, quiet character of our existing single-family neighbourhoods while focusing on mixed-use walkability where infrastructure already supports it.
      - name: "Kashif (Kash) Chaudry"
        status: no-response
      - name: "Farah Shamim"
        status: no-response
  - id: race-town
    title: "Town Councillor"
    note: "Sits on Oakville Town Council."
    candidates:
      - name: "Syed Tahir"
        website: "http://www.syedtahir.ca/"
        status: late
        received: "October 6, 2026"
        scores:
          ambition: 3
          money: 1
          network: 2
          health: 2.5
        responses:
          transport-mode: |
            I usually get around by car or bike for shorter trips within about 1 km, but my family and I also use Oakville Transit and GO Transit from time to time. When my grandchildren visit, I enjoy taking Oakville Transit with them to explore different parts of our beautiful town.

            I also appreciate initiatives that make transit more convenient for local events. For example, my family and I chose to take the special bus service for the Terry Fox Run this year. I appreciate Oakville’s free transit program for seniors, children and youth, which helps make transit more accessible and encourages younger residents to become comfortable using public transit.

            Whether someone drives, takes transit, walks or cycles, I believe having practical transportation choices benefits our community.
          transit: |
            I’m encouraged to see more people using transit in Oakville, and I appreciate the Town’s free transit program for seniors, children and youth. As Oakville continues to grow, I would like to see transit become an easier and more practical choice for more residents.

            In Ward 4, I’m interested in how the Palermo West/Bronte Creek Ride On-Demand service is working for residents. I would also want to look at what residents are experiencing with regular routes, including frequency, wait times, accessibility and connections to GO Transit.

            If elected, I would look at both ridership data and what we are hearing directly from residents to better understand where improvements are needed. I think it is especially important that transit remains accessible for seniors, people with disabilities and families with young children.
          vision-zero: |
            I support the goal of Vision Zero because I believe everyone should be able to get around their neighbourhood safely. Oakville has made progress through traffic calming, pedestrian crossovers, Community Safety Zones and other road-safety improvements, but there is still more work to do.

            While canvassing, I’ve heard concerns from residents about speeding, pedestrian safety and dangerous driving. Depending on the location and the problem, I would support looking at measures such as traffic calming, safer crossings, better visibility and lighting, and appropriate cycling infrastructure.

            E-scooters are another concern I’ve heard about. As the Town completes its current review, I believe pedestrian safety should come first, especially for seniors, children and people with disabilities. We need clear rules, education and an approach to enforcement that can realistically work. I would also be open to exploring options such as permitting or rider registration, if they are legally and practically feasible, to improve education and accountability.

            Some roads and safety issues also involve the Region or other agencies. In those cases, I would work with our Regional Councillor and the appropriate partners to make sure Ward 4 concerns are heard and followed up on. For me, the real measure of progress is whether speeds and serious collisions are coming down and residents feel safer in their neighbourhoods.
          safety-investment: |
            Yes. While canvassing, I’ve learned a lot from residents about their transportation needs and the different ways people get around our community.

            Cars will continue to be important for many residents, but we also need safe sidewalks, pedestrian crossings, cycling routes, trails and reliable transit. I am prepared to support investments that can make getting around safer, provided they are based on evidence and are a responsible use of taxpayer dollars.

            When looking at individual projects, I would consider the safety need, accessibility, the impact on the surrounding community and value for taxpayers. I believe investing in a demonstrated safety need is a responsible use of public dollars.
          walking-cycling: |
            I think people are much more likely to walk or cycle when they feel they can safely get all the way to where they are going. A good sidewalk, trail or cycling route is less useful if it suddenly ends or leaves someone facing an unsafe crossing.

            I would support looking at gaps in our sidewalks and cycling routes, safer crossings, adequate lighting and accessible trails, especially where they help connect residents to schools, parks, transit and other places they regularly need to go.

            Some barriers, such as highways, rail corridors and major Regional roads, involve different levels of government. Where the Town cannot make an improvement on its own, I would work with the appropriate partners to advocate for safer and better-connected routes.
          bike-infrastructure: |
            Yes. As someone who uses a bicycle myself for shorter trips, I know how much the design of a road can affect whether you feel comfortable cycling on it.

            I support expanding safe and connected cycling infrastructure where it makes sense and is supported by evidence and good planning. Different roads may need different solutions. In some places that could mean slower speeds or safer intersections, while busier or faster roads may need more separation between cyclists and vehicles.

            If elected, I would work with Town staff, residents and other partners where needed to improve connections and make our roads safer for everyone. Making cycling safer also gives residents another practical option for shorter trips.
          health-environment: |
            I think the way we get around has a real impact on both our health and our environment. When people have safe places to walk and cycle, it gives them more opportunities to be active in their everyday lives. Having convenient transit and other transportation choices can also help reduce congestion and transportation-related emissions.

            Cars will continue to be necessary for many residents, while others may be able to walk, cycle or take transit for some trips. I think we should encourage those choices by making them safer, easier and more accessible, while recognizing that one option will not work for everyone.

            Giving residents more practical choices can help us build a healthier, better-connected and more sustainable Oakville.
          land-use: |
            I think transportation and growth need to be planned together. As Oakville grows, we should be thinking from the beginning about how residents will actually get around, including access to transit, safe walking and cycling connections, and nearby services where appropriate.

            This is especially important in Ward 4 as areas such as Palermo Village continue to grow. I would want to make sure transportation infrastructure and community services keep pace with development and that we look at the overall impact of growth rather than each development in isolation.

            For me, the goal is to give residents more practical ways to get around while respecting our existing neighbourhoods and making sure new growth is supported by the infrastructure it needs.
