# Oakville Ward 6
#
# One file per page. A page has one or more races (Oakville wards have two). Each race lists its candidates.
# Candidates are shown alphabetically by name, whatever order they are listed in here.
#
# Example race with every field filled in (copy it, then delete the leading "# "):
#
# races:
#   - id: race-ward                 # Unique on the page. Used for links and "Jump to" anchors.
#     title: Ward Councillor        # Heading for the race (shown only when the page has two or more races).
#     note: Sits on Burlington City Council and Halton Regional Council.   # Short line under the heading.
#     candidates:
#       - name: Jane Example        # Required.
#         website: https://example.com    # Optional. Campaign website; omit the line if none.
#         status: on-time             # on-time | late | late-pending | no-response
#                                     #   on-time       responded by the deadline, scored
#                                     #   late          responded after the deadline, scored and posted
#                                     #   late-pending  responded after the deadline, not yet scored or posted
#                                     #   no-response   did not respond
#         received: October 2, 2026   # Date the response arrived, as text. Optional for no-response.
#         scores:                     # 0 to 4 each. Only for on-time and late. Leave the whole block out for
#                                     # no-response and late-pending, and also for an on-time or late candidate
#                                     # whose response is still being scored: the page then shows "Rating in progress"
#                                     # and their answers, and the scores appear once you add this block.
#           ambition: 3
#           money: 2                  # Where the Money Goes
#           network: 4                # A Network for Everyone
#           health: 3                 # Health and Environment
#         responses:                  # Keyed by question id from questions.yml. Use "|" for the text.
#           transport-mode: |         # A blank line starts a new paragraph.
#             First paragraph of the answer, exactly as submitted.
#
#             Second paragraph.
#         sent: October 5, 2026       # Optional, no-response only: when the survey was sent ...
#         followed_up: October 12, 2026   # ... and when we followed up. Both optional.
#         open: true                  # Optional. Show this candidate expanded when the page loads.
#
# A ward with no responses yet: leave "candidates: []" and the page says nothing has been posted.

races:
  - id: race-regional
    title: "Regional & Town Councillor"
    note: "Sits on both Oakville Town Council and Halton Regional Council."
    candidates: []
  - id: race-town
    title: "Town Councillor"
    note: "Sits on Oakville Town Council."
    candidates:
      - name: "Smita Tulsani"
        status: on-time
        received: "September 24, 2026"
        scores:
          ambition: 3.5
          money: 3
          network: 3
          health: 1.5
        responses:
          transport-mode: |
            I primarily use a car. Between work, family and community commitments, it is currently the most practical way for me to get around Oakville.

            But good transportation planning should not assume everyone travels the same way. My objective is to make driving, transit, walking and cycling safer and more practical so residents have genuine choices.
          transit: |
            I would focus on frequency, reliability and connectivity before simply expanding the map.

            Oakville introduced the first phase of its Frequent Transit Network in 2025, improving service on Trafalgar and Dundas, and Oakville Transit recorded more than five million boardings that year. That tells us demand is there.

            My priorities would be:

            • strengthen frequent service on major corridors such as Dundas and Trafalgar;

            • improve connections to GO stations, employment areas, schools and growing neighbourhoods;

            • improve first- and last-mile connections so residents can actually reach frequent transit;

            • improve stop accessibility, lighting, shelters and real-time service information; and

            • use ridership, reliability and wait-time data to determine where additional service should go.

            Accessibility also has to be designed into the system. Oakville's free care-A-van service for registered riders is a good example of removing a practical mobility barrier.

            The measure of success should be straightforward: Can residents get where they need to go reliably, safely and within a reasonable amount of time?
          vision-zero: |
            The objective of Vision Zero is clear: prevent traffic deaths and serious injuries. I support that objective, but I also want us to be very focused on implementation.

            Oakville already uses measures including traffic calming, pedestrian crossovers and Community Safety Zones. I would build on that with a more responsive neighbourhood safety process.

            When residents repeatedly identify speeding or a dangerous intersection, there should be a clear path from complaint to data collection to action.

            I would push for four steps:

            Identify → Measure → Act → Report back.

            That means collecting speed and collision data, prioritizing school zones and locations involving vulnerable road users, implementing appropriate measures such as speed cushions, curb extensions, improved crossings or intersection changes, and then measuring the results.

            Residents should not have to spend months trying to determine which department, developer or level of government is responsible before a safety concern is addressed.
          safety-investment: |
            I would apply a clear test to major transportation spending:

            Does it improve safety? Does it solve a demonstrated problem? Does it improve mobility? Is it accessible? And does the benefit justify the cost to taxpayers?

            Yes, I am prepared to support investments that demonstrably improve safety.

            But I would not support projects simply because they favour cars, transit or bicycles. Transportation dollars are limited, and investments should address real needs and produce measurable results.

            The goal is a balanced network that works better for everyone.
          walking-cycling: |
            I would start by fixing the places where the network breaks down.

            A beautiful trail is of limited value if a resident cannot safely cross the intersection at the end of it. A sidewalk network is incomplete if people have to cross a dangerous road to reach a school, park or transit stop.

            I would prioritize school routes, parks, transit stops, community facilities and known sidewalk or trail gaps, particularly where residents are already reporting safety concerns.

            That includes better crossings, lighting, sidewalk and trail maintenance, visibility at intersections and safer connections between neighbourhoods.

            For barriers involving provincial or regional infrastructure, I would expect the Town to actively work with the responsible government rather than simply tell residents that the road is outside Town jurisdiction.
          bike-infrastructure: |
            Yes, where it improves safety, creates a useful connection and makes sense for the road.

            I would assess projects individually based on road width, traffic volumes, collision and safety data, connectivity, parking impacts, emergency access and cost.

            I am particularly interested in closing meaningful gaps between neighbourhoods, schools, parks, trails and transit.

            My test is not simply, "Did we build another kilometre of bike lane?" It is, "Did we create a safer and more useful transportation connection?"

            That distinction matters.
          health-environment: |
            Transportation policy affects far more than how we move. It affects the time families spend commuting, neighbourhood safety, physical activity, emissions and ultimately quality of life.

            Oakville's Transportation Master Plan recognizes accessibility, safety, active transportation, transit and greenhouse-gas reduction as part of the Town's long-term transportation direction.

            My approach is not to tell residents how they should travel. It is to make the alternatives good enough that people genuinely have a choice.

            If transit is reliable, walking routes are safe and cycling connections actually connect to useful destinations, residents will use them when those options make sense.
          land-use: |
            This is where my Infrastructure-First Growth approach becomes especially important.

            I do not believe we should approve significant growth and then ask residents to wait years for roads, transit and other infrastructure to catch up.

            Oakville's current Transportation Master Plan is intended to coordinate transportation and growth through 2051. I want that planning translated into accountability at the development level.

            For major developments, I would consistently ask three questions:

            1. What transportation infrastructure is required?

            2. When will it actually be delivered?

            3. How will we measure whether it is keeping pace with growth?

            Where appropriate, growth should be directed toward areas with strong access to transit, employment and services. New communities should also be designed so schools, parks, shops and transit can be reached safely without requiring a car for every single trip.

            For me, infrastructure-first growth means exactly that: roads, transit, safety and community infrastructure cannot continually be an afterthought to development.

            Good growth should build connected communities, not simply add homes and traffic.
