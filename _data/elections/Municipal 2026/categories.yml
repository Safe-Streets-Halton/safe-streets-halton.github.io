# The four scoring categories, in the order they appear on the survey pages.
# key   Matches the keys under "scores:" in each candidate's entry (ward-N.yml / mayor.yml).
# label Shown on the page.
# icon  Matches an icon in _includes/survey-icon-sprite.html.
# description  One sentence shown under the label on the elections page and in the survey-page legend.
#              Keep it general: it must not hint at what earns points in the (unpublished) rubric.
- key: ambition
  label: Ambition
  icon: compass
  description: "How ambitious a candidate’s vision is for safer streets."
- key: money
  label: Where the Money Goes
  icon: coins
  description: "How a candidate would prioritize transportation spending."
- key: network
  label: A Network for Everyone
  icon: people-group
  description: "How a candidate would make it easier and safer to get around."
- key: health
  label: Health and Environment
  icon: heart-pulse
  description: "How a candidate sees the links between transportation, health, the environment and land use."
