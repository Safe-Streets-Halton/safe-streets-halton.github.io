{%- comment -%} Four icons, the first {{ include.score }} filled; a .5 score half-fills the next icon. Params: icon, score (0–4 in steps of 0.5), size class. {%- endcomment -%}
{%- for k in (1..4) -%}{%- assign half_at = k | minus: 0.5 -%}<svg class="sv-ico {{ include.size }}{% if k <= include.score %} is-on{% elsif half_at <= include.score %} is-half{% endif %}" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><use href="#sv-icon-{{ include.icon }}"/></svg>{%- endfor -%}
